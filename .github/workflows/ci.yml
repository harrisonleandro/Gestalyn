name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar .NET (versão do global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore ProjectManager.sln

      - name: Compilar
        run: dotnet build ProjectManager.sln --configuration Release --no-restore

      - name: Executar testes
        run: >-
          dotnet test ProjectManager.sln
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory TestResults

      - name: Publicar resultados dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
